[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ludo-desktop"
version = "0.1.0"
description = "A Python desktop implementation of Ludo (Chińczyk)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.4.1,<10"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
ludo = "src.main:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
