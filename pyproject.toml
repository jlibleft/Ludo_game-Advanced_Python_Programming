[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[project]
name = "ludo-desktop"
version = "0.1.0"
description = "A Python desktop implementation of Ludo (Chińczyk)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "package-name>=0.1",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[dependency-groups]
dev = ["pytest>=8.4.1,<10", "ruff>=0.14,<1"]

[project.scripts]
ludo = "Ludo.main:main"

[tool.uv.build-backend]
module-name = "Ludo"
module-root = "src"
source-include = ["tests/**", "tools/**", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.coverage.run]
data_file = ".cache/coverage/.coverage"

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.xml]
output = ".cache/coverage/coverage.xml"

[tool.coverage.json]
output = ".cache/coverage/coverage.json"

[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py311"
line-length = 79
src = ["src"]
extend-exclude = [".cache"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # Syntax and essential style checks.
    "F", "I",         # Undefined/unused names and import sorting.
    "B", "UP",        # Common bugs and modern Python syntax.
    "SIM", "C4", "RET",  # Simplifications, comprehensions, and returns.
    "N", "A", "SLF",  # Naming, builtin shadowing, and private access.
    "D", "ANN",       # Docstrings and type annotations.
    "PT", "RUF",      # pytest conventions and Ruff-specific checks.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/Ludo/**/__init__.py" = ["D104", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
cache-dir = ".cache/uv"
